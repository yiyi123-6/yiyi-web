# Weekly: pull recent hikes from Garmin Connect, merge them into src/data/hikes.json,
# build, commit if anything changed, and redeploy GitHub Pages.
# Uses Garmin's official Connect Personal API (see README > Hiking data from Garmin).
# Does nothing until the GARMIN_API_KEY repo secret exists.
#
# Deploys inline (upload-pages-artifact -> deploy job) because commits pushed with
# GITHUB_TOKEN deliberately don't trigger other workflows, so deploy.yml wouldn't run.
name: Garmin weekly sync

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC (scheduled runs only fire from the default branch)
  workflow_dispatch:
    inputs:
      days:
        description: How many days back to look for hikes
        required: false
        default: '45'
      force_deploy:
        description: Rebuild and redeploy even if no hikes changed
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.diff.outputs.changed == 'true' || (steps.check.outputs.enabled == 'true' && inputs.force_deploy == true) }}
    steps:
      - name: Check for Garmin secrets
        id: check
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: |
          if [ -n "$GARMIN_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Garmin sync skipped::Add your Garmin Personal API key as GARMIN_API_KEY under Settings > Secrets and variables > Actions."
            echo "Garmin sync skipped: no Garmin secrets configured. Nothing was changed or deployed." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.enabled == 'true'
        run: npm ci

      # garmin_sync.py exits 2 when Garmin rejects the key; the job stops here, so nothing is committed or deployed.
      - name: Download hikes from Garmin Connect
        if: steps.check.outputs.enabled == 'true'
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
          DAYS: ${{ inputs.days || '45' }}
        run: |
          set +e
          python scripts/garmin_sync.py --days "$DAYS" --out "$RUNNER_TEMP/garmin"
          code=$?
          if [ "$code" = 2 ]; then
            {
              echo "### Garmin rejected the API key"
              echo "Nothing was changed or deployed. The Personal API key in GARMIN_API_KEY is wrong, deleted or expired:"
              echo "create a new one at https://connect.garmin.com/app/settings/personalApiToken and update the secret."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Merge into src/data/hikes.json
        if: steps.check.outputs.enabled == 'true'
        run: |
          dir="$RUNNER_TEMP/garmin"
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).length)" "$dir/activities.json")
          if [ "$count" = 0 ]; then
            echo "No hikes on Garmin in this window."
          else
            # --private (the default): no dates, start times or GPS start points in the public repo.
            # Same-name pieces from one day are merged; hand-edited names, text and photos are kept.
            node scripts/import-garmin.mjs "$dir" --min-km 2 --private
          fi

      - name: Check for changes
        id: diff
        if: steps.check.outputs.enabled == 'true'
        run: |
          if git diff --quiet -- src/data/hikes.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new or updated hikes." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "### hikes.json updated"; echo '```'; git diff --stat -- src/data/hikes.json; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # <user>.github.io repos are served from "/", every other repo from "/<repo-name>/".
      - name: Compute base path
        if: steps.diff.outputs.changed == 'true' || (steps.check.outputs.enabled == 'true' && inputs.force_deploy == true)
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/$REPO/" >> "$GITHUB_ENV"
          fi

      # Built before committing so a hikes.json that breaks the site never lands on main.
      - name: Build
        if: steps.diff.outputs.changed == 'true' || (steps.check.outputs.enabled == 'true' && inputs.force_deploy == true)
        run: npm run build

      - name: Commit and push hikes.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hikes.json
          git commit -m "Sync hikes from Garmin Connect ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v5
        if: steps.diff.outputs.changed == 'true' || (steps.check.outputs.enabled == 'true' && inputs.force_deploy == true)

      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true' || (steps.check.outputs.enabled == 'true' && inputs.force_deploy == true)
        with:
          path: dist

  deploy:
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
